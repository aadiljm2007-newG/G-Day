<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hindi</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .lyric-block {
      display: none;
      margin-bottom: 30px;
      transition: all 0.3s ease;
      opacity: 0;
    }
    .lyric-block.active {
      display: block;
      color: #000;
      font-size: 26px;
      opacity: 1;
      transform: scale(1.05);
    }
    .lyric-block.past {
      display: block;
      color: #aaa;
      font-size: 18px;
      opacity: 0.5;
    }

  </style>
</head>
<body class="inline-style-b38d345f">

  <!-- Tracking & Nav -->
  <script>localStorage.setItem('visited_hindi', 'true');</script>
  <button class="wq-btn inline-style-94e770e9"  onclick="window.location.href='success.html'">Back to Languages</button>

  <div id="language-layout" class="tri-pane-layout inline-style-2283a8de">
    
    <!-- LEFT PANE: PHOTO CANVAS -->
    <div id="image-canvas"  class="inline-style-39f90766">
       <!-- Images will drop in here dynamically -->
    </div>

    <!-- RIGHT PANE: LYRICS -->
    <main id="lyrics-pane" class="pane pane-middle inline-style-0dae0a74">
      <audio id="bgm" src="hindi_bgm.mp3"></audio>
      
      <div id="lyrics-container"  class="inline-style-db5abeaf">
        <h3>sufr, Arpit Bala, toorjo dey</h3>
        <h3 class="inline-style-138f8f43">Bargad</h3>
        
        <div id="lyrics-render"></div>
      </div>

      <!-- Custom Audio Player -->
      <div id="player-container"  class="inline-style-d6ad7464">
        
        <div class="inline-style-157f2ff0">
          <button id="play-pause-btn"  onmousedown="this.style.transform='translate(4px, 4px)'; this.style.boxShadow='0 0 0 #000';" onmouseup="this.style.transform='translate(0, 0)'; this.style.boxShadow='4px 4px 0 #000';" class="inline-style-d98ea8dc">▶</button>
          
          <div class="inline-style-99129a50">
            <span id="time-display"  class="inline-style-03ff4c00">0:00 / 0:00</span>
            
            <button id="speed-btn"  onmousedown="this.style.transform='translate(4px, 4px)'; this.style.boxShadow='0 0 0 #000';" onmouseup="this.style.transform='translate(0, 0)'; this.style.boxShadow='4px 4px 0 #000';" class="inline-style-81aacfaa">1.0x</button>
          </div>
        </div>

        <div id="progress-bar-container" class="inline-style-5fe4558d">
          <div id="progress-bar-fill"  class="inline-style-77394a30"></div>
        </div>
      </div>
    </main>
  </div>



  <script>
    let lyrics = [
      { text: "Mann mera kacchi gali<br/>Jo sirf kadmon se sajti tere<br/>Choole ki aag mein jalta hu roz<br/>Bas ek teri haath ki roti ke liye", time: 0 },
      { text: "Shabnam jaise mujh mein ghul hi jaa tu<br/>Deewaaron pe likha tera mera hi naam<br/>Pata tera jo bhool gaye toh Bataao na phir ab jaayein kahan?", time: 14.28 },
      { text: "Soona soona lage bina tere<br/>Karta raha phir bhi sajda tera<br/>Tere honthon tak jo<br/>Hai safar mujhe", time: 26.26 },
      { text: "Pohoch hi hai jaana par<br/>Bargad tale jo main baithu kabhi<br/>Saaye mein bhi dikhe chehra tera<br/>Tera zikr bhi jaadu kare", time: 35.6 },
      { text: "Hawaayein bhi laaye sandesha tera<br/>Ye deewanapan, mujhe le dooba inn lakeeron mein<br/>Tu likhi hai ya nahi?<br/>Karu naam ki teri ibaadatein", time: 47.69 },
      { text: "Teri galliyon ka hi hoon main aashiq baby<br/>Ki raani teri ek jhalak sе main pagal (Hoon main pagal)<br/>Sametu teri khushboo ko choom ke chaadar", time: 59.64 },
      { text: "(Choom ke chaadar)<br/>Hawa ko roke dhool sajaata teri Pehne na tu payal<br/>Bin bataaye aati yaadon mein bhi<br/>Som ka jharoka maano aankhon mein teri", time: 88.05 },
      { text: "Inn mein doob sa gaya hoon karke pooja jo teri<br/>Ye palkein bheeg jaati<br/>Kyun hai tu itni pyaari?<br/>Meri bhaasha hi badal di", time: 96.87 },
      { text: "Pyaari seedhi saadhi<br/>Ke raani jo tu aaye iss dil mein ho halchal<br/>(Hoon main pagal)<br/>Bargad tale intezaar tera, main karu kab tak?", time: 109.05 },
      { text: "Soona soona lage bina tere<br/>Karta raha phir bhi sajda tera<br/>Tere honthon tak jo<br/>Hai safar mujhe", time: 124.26 },
      { text: "Pohoch hi hai jaana par<br/>Bargad tale jo main baithu kabhi<br/>Saaye mein bhi dikhe chehra tera<br/>Tera zikr bhi jaadu kare", time: 134.03 },
      { text: "Hawaayein bhi laaye sandesha tera<br/>Ye deewanapan, mujhe le dooba inn lakeeron mein<br/>Tu likhi hai ya nahi?<br/>Karu naam ki teri ibaadatein", time: 145.87 },
      { text: "Teri galliyon ka hi hoon main aashiq baby", time: 158.06 }
    ];

    const images = [
        "hindi/Cute2.jpeg",
        "hindi/Cute6.jpeg",
        "hindi/Us1.jpeg",
        "hindi/WhatsApp Image 2026--31 at 12.31.00 AM.jpeg",
        "hindi/WhatsApp Image 2026-07-31 at 1.27.34 AM.jpeg",
        "hindi/WhatsApp Image 2026-07-31 at 12.30.56.jpeg",
        "hindi/WhatsApp Image 2026-07-31 at 12.30.57 AM.jpeg",
        "hindi/WhatsApp Image 2026-07-31 at 12.30.59 AM.jpeg",
        "hindi/WhatsApp Image 2026-07-31 at 12.31.03 A.jpeg",
        "hindi/cute1.jpeg",
        "hindi/cute4.jpeg",
        "hindi/hand.jpeg",
        "hindi/hands.jpeg",
        "hindi/hindi.jpeg"
    ];
    
    // We shuffle the images slightly so it feels organic
    const shuffledImages = images.sort(() => Math.random() - 0.5);

    const specialImage = "hindi/Hindi2.jpeg";
    
    let currentImageIdx = 0;

    function dropImage(isSpecial) {
        const canvas = document.getElementById('image-canvas');
        const img = document.createElement('img');
        
        img.src = isSpecial ? specialImage : shuffledImages[currentImageIdx % shuffledImages.length];
        if (!isSpecial) currentImageIdx++;
        
        // Polaroid brutalist styling
        img.className = 'polaroid-img';
        
        // Random placement and rotation
        const rot = (Math.random() - 0.5) * 60; // -30 to 30 degrees
        const isMobile = window.innerWidth <= 768;
        const offsetRange = isMobile ? 50 : 150;
        const offsetX = (Math.random() - 0.5) * offsetRange;
        const offsetY = (Math.random() - 0.5) * offsetRange;
        
        // Initial drop animation state
        img.style.top = `calc(50% + ${offsetY}px)`;
        img.style.left = `calc(50% + ${offsetX}px)`;
        img.style.transform = `translate(-50%, -50%) rotate(${rot}deg) scale(1.5)`;
        img.style.opacity = '0';
        img.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        
        canvas.appendChild(img);

        // Trigger reflow to start animation
        setTimeout(() => {
            img.style.opacity = '1';
            img.style.transform = `translate(-50%, -50%) rotate(${rot}deg) scale(1)`;
        }, 10);
    }

    const renderDiv = document.getElementById('lyrics-render');
    const audio = document.getElementById('bgm');

    lyrics.forEach((l, idx) => {
      let div = document.createElement('div');
      div.className = 'lyric-block';
      div.id = 'lyric-' + idx;
      div.innerHTML = l.text;
      renderDiv.appendChild(div);
    });

    let currentActiveIdx = -1;

    const playBtn = document.getElementById('play-pause-btn');
    const progressContainer = document.getElementById('progress-bar-container');
    const progressFill = document.getElementById('progress-bar-fill');
    const timeDisplay = document.getElementById('time-display');
    const speedBtn = document.getElementById('speed-btn');

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ":" + (s < 10 ? '0' : '') + s;
    }

    const speeds = [1.0, 1.25, 1.5, 2.0, 0.5];
    let speedIdx = 0;
    speedBtn.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        audio.playbackRate = speeds[speedIdx];
        speedBtn.innerText = speeds[speedIdx].toFixed(1) + 'x';
    });

    audio.addEventListener('loadedmetadata', () => {
        timeDisplay.innerText = "0:00 / " + formatTime(audio.duration);
    });

    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play();
            playBtn.innerText = '⏸';
        } else {
            audio.pause();
            playBtn.innerText = '▶';
        }
    });

    progressContainer.addEventListener('click', (e) => {
        const rect = progressContainer.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pos * audio.duration;
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
          progressFill.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
          timeDisplay.innerText = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      }

      const t = audio.currentTime;
      let activeIdx = -1;
      
      for(let i=0; i<lyrics.length; i++) {
        if (t >= lyrics[i].time) {
          activeIdx = i;
        }
      }

      if (activeIdx !== currentActiveIdx && activeIdx >= 0) {
        document.querySelectorAll('.lyric-block').forEach(el => {
            el.classList.remove('active');
            el.classList.remove('past');
        });

        for(let i=0; i<activeIdx; i++) {
            document.getElementById('lyric-' + i).classList.add('past');
        }
        
        const activeEl = document.getElementById('lyric-' + activeIdx);
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        // Trigger a photo drop!
        const isSpecialTrigger = lyrics[activeIdx].text.toLowerCase().includes("ki raani teri");
        dropImage(isSpecialTrigger);

        currentActiveIdx = activeIdx;
      }
    });



  </script>
</body>
</html>
