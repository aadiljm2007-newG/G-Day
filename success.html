<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Success!</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Tri-Pane Layout Container to keep the same style -->
  <div class="tri-pane-layout">
    
    <main class="pane pane-middle">
      <div class="inline-style-9cda08fc">
        <div id="progress-text"  class="inline-style-409d8416">Progress: 0/3</div>
        <div class="inline-style-3ce1f13e">
          <div id="progress-fill"  class="inline-style-28b9c7f9"></div>
        </div>
      </div>

      <div class="wife-question">
        <h1 class="wq-title inline-style-61df16ba">Choose the Language to view First :3</h1>
        <div class="wq-buttons inline-style-42f54ea8">
          <div class="inline-style-324d575d">
            <img src="English/Cute5.jpeg" alt="Sarah - English"  / class="inline-style-720a10d1">
            <button class="wq-btn inline-style-30ae8514"  onclick="window.location.href='english.html'">SARAH</button>
          </div>
          <div class="inline-style-324d575d">
            <img src="Tamil/Saree.jpeg" alt="Sarah - Tamil"  / class="inline-style-720a10d1">
            <button class="wq-btn inline-style-30ae8514"  onclick="window.location.href='tamil.html'">ஸாராஹ்</button>
          </div>
          <div class="inline-style-324d575d">
            <img src="hindi/Hindi2.jpeg" alt="Sarah - Hindi"  / class="inline-style-720a10d1">
            <button class="wq-btn inline-style-30ae8514"  onclick="window.location.href='hindi.html'">साराह्</button>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script>
    const visitedTamil = localStorage.getItem('visited_tamil') === 'true';
    const visitedEnglish = localStorage.getItem('visited_english') === 'true';
    const visitedHindi = localStorage.getItem('visited_hindi') === 'true';
    
    let count = 0;
    if (visitedTamil) count++;
    if (visitedEnglish) count++;
    if (visitedHindi) count++;

    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    
    progressFill.style.width = (count / 3 * 100) + '%';
    progressText.innerText = 'Progress: ' + count + '/3';

    if (count === 3) {
      setTimeout(() => {
        window.location.href = 'final.html';
      }, 1500); // 1.5s delay to see 3/3 before teleporting
    }
  </script>
</body>
</html>
