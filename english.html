<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .lyric-block {
      display: none;
      margin-bottom: 30px;
      transition: all 0.3s ease;
      opacity: 0;
    }
    .lyric-block.active {
      display: block;
      color: #000;
      font-size: 26px;
      opacity: 1;
      transform: scale(1.05);
    }
    .lyric-block.past {
      display: block;
      color: #aaa;
      font-size: 18px;
      opacity: 0.5;
    }

  </style>
</head>
<body class="inline-style-b38d345f">

  <!-- Tracking & Nav -->
  <script>localStorage.setItem('visited_english', 'true');</script>
  <button class="wq-btn inline-style-94e770e9"  onclick="window.location.href='success.html'">Back to Languages</button>

  <div id="language-layout" class="tri-pane-layout inline-style-2283a8de">
    
    <!-- LEFT PANE: PHOTO CANVAS -->
    <div id="image-canvas"  class="inline-style-39f90766">
       <!-- Images will drop in here dynamically -->
    </div>

    <!-- RIGHT PANE: LYRICS -->
    <main id="lyrics-pane" class="pane pane-middle inline-style-0dae0a74">
      <audio id="bgm" src="english_bgm.mp3"></audio>
      
      <div id="lyrics-container"  class="inline-style-db5abeaf">
        <h3>Elvis Presley</h3>
        <h3 class="inline-style-138f8f43">Can't Help Falling in Love</h3>
        
        <div id="lyrics-render"></div>
      </div>

      <!-- Custom Audio Player -->
      <div id="audio-player-container"  class="inline-style-d6ad7464">
        
        <div class="inline-style-157f2ff0">
          <button id="play-pause-btn"  onmousedown="this.style.transform='translate(4px, 4px)'; this.style.boxShadow='0 0 0 #000';" onmouseup="this.style.transform='translate(0, 0)'; this.style.boxShadow='4px 4px 0 #000';" class="inline-style-d98ea8dc">▶</button>
          
          <div class="inline-style-99129a50">
            <span id="time-display"  class="inline-style-03ff4c00">0:00 / 0:00</span>
            
            <button id="speed-btn"  onmousedown="this.style.transform='translate(4px, 4px)'; this.style.boxShadow='0 0 0 #000';" onmouseup="this.style.transform='translate(0, 0)'; this.style.boxShadow='4px 4px 0 #000';" class="inline-style-81aacfaa">1.0x</button>
          </div>
        </div>

        <div id="progress-bar-container" class="inline-style-5fe4558d">
          <div id="progress-bar-fill"  class="inline-style-77394a30"></div>
        </div>
      </div>
    </main>
  </div>



  <script>
    let lyrics = [
      { text: "Wise men say<br/>Only fools rush in", time: 7.7 },
      { text: "But I can't help<br/>Falling in love with you", time: 21.6 },
      { text: "Shall I stay<br/>Would it be a sin?", time: 37.7 },
      { text: "If I can't help<br/>Falling in love with you?", time: 50.44 },
      { text: "Like a river flows<br/>Surely to the sea", time: 65.07 },
      { text: "Darling, so it goes<br/>Some things are meant to be", time: 72.09 },
      { text: "Take my hand<br/>Take my whole life too", time: 82.96 },
      { text: "For I can't help<br/>Falling in love with you", time: 96.94 },
      { text: "Like a river flows<br/>Surely to the sea", time: 112.64 },
      { text: "Darling, so it goes<br/>Some things are meant to be", time: 118.32 },
      { text: "Take my hand<br/>Take my whole life too", time: 129.14 },
      { text: "For I can't help<br/>Falling in love with you", time: 144.28 },
      { text: "For I can't help<br/>Falling in love with you", time: 157.18 }
    ];

    const images = [
        "English/-31 at 12.31.00 AM.jpeg",
        "English/144.jpeg",
        "English/45855.jpeg",
        "English/Cute5.jpeg",
        "English/WhatsA 2026-07-31 at 12.31.02 AM.jpeg",
        "English/WhatsApp Image 2026-07-31 at 12..jpeg",
        "English/WhatsApp Image 2026-07-31 at 12.30.5.jpeg",
        "English/WhatsApp Image 2026-07-31 at 12.30.58 AM.jpeg",
        "English/WhatsApp Image 2026-07-31 at 12.31.01 AM.jpeg",
        "English/WhatsApp Image 2026-07-31 at 12.32.43 AM.jpeg",
        "English/WhatsApp Image 2026-07M.jpeg",
        "English/pio.jpeg",
        "English/sleepy.jpeg",
        "English/us4.jpeg"
    ];
    
    // We shuffle the images slightly so it feels organic
    const shuffledImages = images.sort(() => Math.random() - 0.5);

    const specialImage = "English/us2.jpeg";
    
    let currentImageIdx = 0;

    function dropImage(isSpecial) {
        const canvas = document.getElementById('image-canvas');
        const img = document.createElement('img');
        
        img.src = isSpecial ? specialImage : shuffledImages[currentImageIdx % shuffledImages.length];
        if (!isSpecial) currentImageIdx++;
        
        // Polaroid brutalist styling
        img.style.position = 'absolute';
        img.style.width = '350px'; 
        img.style.height = 'auto';
        img.style.maxHeight = '450px';
        img.style.objectFit = 'contain';
        img.style.backgroundColor = '#fff';
        img.style.border = '12px solid #fff';
        img.style.borderBottom = '50px solid #fff'; 
        img.style.boxShadow = '8px 8px 0 #000';
        
        // Random placement and rotation
        const rot = (Math.random() - 0.5) * 60; // -30 to 30 degrees
        const offsetX = (Math.random() - 0.5) * 150;
        const offsetY = (Math.random() - 0.5) * 150;
        
        // Initial drop animation state
        img.style.top = `calc(50% + ${offsetY}px)`;
        img.style.left = `calc(50% + ${offsetX}px)`;
        img.style.transform = `translate(-50%, -50%) rotate(${rot}deg) scale(1.5)`;
        img.style.opacity = '0';
        img.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        
        canvas.appendChild(img);

        // Trigger reflow to start animation
        setTimeout(() => {
            img.style.opacity = '1';
            img.style.transform = `translate(-50%, -50%) rotate(${rot}deg) scale(1)`;
        }, 10);
    }

    const renderDiv = document.getElementById('lyrics-render');
    const audio = document.getElementById('bgm');

    lyrics.forEach((l, idx) => {
      let div = document.createElement('div');
      div.className = 'lyric-block';
      div.id = 'lyric-' + idx;
      div.innerHTML = l.text;
      renderDiv.appendChild(div);
    });

    let currentActiveIdx = -1;

    const playBtn = document.getElementById('play-pause-btn');
    const progressContainer = document.getElementById('progress-bar-container');
    const progressFill = document.getElementById('progress-bar-fill');
    const timeDisplay = document.getElementById('time-display');
    const speedBtn = document.getElementById('speed-btn');

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ":" + (s < 10 ? '0' : '') + s;
    }

    const speeds = [1.0, 1.25, 1.5, 2.0, 0.5];
    let speedIdx = 0;
    speedBtn.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        audio.playbackRate = speeds[speedIdx];
        speedBtn.innerText = speeds[speedIdx].toFixed(1) + 'x';
    });

    audio.addEventListener('loadedmetadata', () => {
        timeDisplay.innerText = "0:00 / " + formatTime(audio.duration);
    });

    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play();
            playBtn.innerText = '⏸';
        } else {
            audio.pause();
            playBtn.innerText = '▶';
        }
    });

    progressContainer.addEventListener('click', (e) => {
        const rect = progressContainer.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pos * audio.duration;
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
          progressFill.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
          timeDisplay.innerText = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
      }

      const t = audio.currentTime;
      let activeIdx = -1;
      
      for(let i=0; i<lyrics.length; i++) {
        if (t >= lyrics[i].time) {
          activeIdx = i;
        }
      }

      if (activeIdx !== currentActiveIdx && activeIdx >= 0) {
        document.querySelectorAll('.lyric-block').forEach(el => {
            el.classList.remove('active');
            el.classList.remove('past');
        });

        for(let i=0; i<activeIdx; i++) {
            document.getElementById('lyric-' + i).classList.add('past');
        }
        
        const activeEl = document.getElementById('lyric-' + activeIdx);
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        // Trigger a photo drop!
        const isSpecialTrigger = lyrics[activeIdx].text.toLowerCase().includes("take my hand");
        dropImage(isSpecialTrigger);

        currentActiveIdx = activeIdx;
      }
    });



  </script>
</body>
</html>
